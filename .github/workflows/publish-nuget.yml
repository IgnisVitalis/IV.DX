name: publish-nuget

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Manual version (e.g. 1.2.3). If empty and no tag, uses csproj version.'
        required: false
        default: ''
      coverage_min:
        description: 'Minimum total code coverage percentage required'
        required: false
        default: '60'

permissions:
  contents: read
  packages: write

jobs:
  pack-and-push:
    runs-on: ubuntu-latest

    env:
      SOLUTION_PATH: src/IV.DX/IV.DX.sln
      CORE_PROJECT_PATH: src/IV.DX/IV.DX.Hosting/IV.DX.Hosting.csproj
      POSTGRES_PROJECT_PATH: src/IV.DX/IV.DX.PostgreSQL/IV.DX.PostgreSQL.csproj
      TEST_SETTINGS: src/IV.DX/Tests/CodeCoverage.runsettings
      GPR_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
      NUGET_SOURCE: https://api.nuget.org/v3/index.json

      COVERAGE_MIN: ${{ github.event.inputs.coverage_min || '60' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore (solution)
        run: dotnet restore "$SOLUTION_PATH"

      - name: Determine version from tag or input
        id: v
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RAW="${GITHUB_REF_NAME}"
            VER="${RAW#v}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            VER="${{ github.event.inputs.version }}"
          else
            VER=""
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Build (Release, solution)
        run: |
          if [ -n "${{ steps.v.outputs.version }}" ]; then
            dotnet build "$SOLUTION_PATH" -c Release --no-restore -p:Version=${{ steps.v.outputs.version }} -p:TreatWarningsAsErrors=true
          else
            dotnet build "$SOLUTION_PATH" -c Release --no-restore -p:TreatWarningsAsErrors=true
          fi

      - name: Test (with coverage)
        run: |
          dotnet test "$SOLUTION_PATH" -c Release --no-build --settings "$TEST_SETTINGS" --collect:"XPlat Code Coverage"

      - name: Install reportgenerator tool
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Generate coverage reports (TextSummary + Html + JsonSummary)
        run: |
          reportgenerator \
            -reports:"**/coverage.cobertura.xml" \
            -targetdir:"coveragereport" \
            -reporttypes:"TextSummary;Html;JsonSummary"

      - name: Print coverage summary
        run: |
          echo "===== COVERAGE SUMMARY ====="
          cat coveragereport/Summary.txt || true
          echo "============================"

      - name: Enforce coverage threshold
        shell: bash
        run: |
          if [[ -f "coveragereport/Summary.json" ]]; then
          PCT=$(grep -m1 -oE '"coverage"\s*:\s*[0-9]+(\.[0-9]+)?' coveragereport/Summary.json \
            | grep -oE '[0-9]+(\.[0-9]+)?')
          fi

          if [[ -z "$PCT" && -f "coveragereport/Summary.txt" ]]; then
          PCT=$(grep -m1 -oE 'Coverage:\s*[0-9]+(\.[0-9]+)?%' coveragereport/Summary.txt \
            | grep -oE '[0-9]+(\.[0-9]+)?')
          fi

          if [[ -z "$PCT" ]]; then
            echo "Could not determine total coverage. Failing to be safe."
            exit 1
          fi

          echo "Total coverage: ${PCT}% (threshold: ${COVERAGE_MIN}%)"

          awk -v p="$PCT" -v t="$COVERAGE_MIN" 'BEGIN{ if (p+0 < t+0) exit 1 }' \
            && echo "✅ Coverage gate PASSED." \
            || { echo "❌ Coverage gate FAILED: ${PCT}% < ${COVERAGE_MIN}%"; exit 1; }

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coveragereport
          if-no-files-found: ignore

      - name: Pack (projects)
        run: |
          mkdir -p artifacts
          # IV.DX and IV.DX.PostgreSQL ship in lockstep on the same version:
          # the provider SPI is internal, so the provider is only valid against
          # the exact core version it was built with.
          for proj in "$CORE_PROJECT_PATH" "$POSTGRES_PROJECT_PATH"; do
            if [ -n "${{ steps.v.outputs.version }}" ]; then
              dotnet pack "$proj" -c Release -o ./artifacts -p:Version=${{ steps.v.outputs.version }} -p:TreatWarningsAsErrors=true
            else
              dotnet pack "$proj" -c Release -o ./artifacts -p:TreatWarningsAsErrors=true
            fi
          done

      - name: Upload test results & coverage
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/TestResults/**
            **/coverage.cobertura.xml
          if-no-files-found: ignore

      - name: Upload nupkgs
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      - name: Add GitHub Packages source
        run: |
          dotnet nuget add source "$GPR_SOURCE" \
            --name "github" \
            --username "${{ github.repository_owner }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --source "github" \
            --skip-duplicate
